<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Family Search Safety Alert — Dashboard</title>
  <style>
    :root {
      --navy: #0F3057; --teal: #007EA7; --accent: #F4A261;
      --muted: #5C6B73; --ice: #CFE3F0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0; min-height: 100vh; color: #222;
      background: linear-gradient(135deg, #0F3057 0%, #0B4F6C 45%, #007EA7 100%);
      background-size: 200% 200%;
      animation: gradientShift 14s ease infinite;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 16px;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
    }
    .card {
      background: #fff; max-width: 440px; width: 100%; margin: 0 auto;
      padding: 40px; border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 48, 87, 0.35);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .icon-circle {
      width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
    }
    .icon-circle svg { width: 24px; height: 24px; }
    h1 { font-size: 21px; color: var(--navy); margin: 0 0 6px; }
    p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 26px; line-height: 1.5; }
    label { display: block; font-weight: 600; font-size: 13.5px; color: var(--navy); margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 11px 12px; border: 1.5px solid #dde5ea; border-radius: 8px;
      font-size: 14px; background: #fbfdfe; transition: border-color .2s, box-shadow .2s;
    }
    input[type=email]:focus {
      outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,126,167,.15); background: #fff;
    }
    button {
      margin-top: 20px; width: 100%; padding: 12px 20px; cursor: pointer;
      background: var(--navy); color: #fff; border: none; border-radius: 9px;
      font-size: 14.5px; font-weight: 600; transition: background .2s, transform .12s;
    }
    button:hover { background: var(--teal); }
    button:active { transform: scale(.98); }
    .demo-note {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid #eef2f5;
      font-size: 11.5px; color: var(--muted); line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z"></path>
      </svg>
    </div>
    <h1>Trusted Contact Dashboard</h1>
    <p class="sub">Enter the email you registered as a trusted contact to view its check-in alert history.</p>

    <form id="loginForm">
      <label for="email">Your email</label>
      <input type="email" id="email" placeholder="you@example.com" required />
      <button type="submit">View my alerts</button>
    </form>

    <div class="demo-note">
      Demo note: for the hackathon, entering any email shows its alerts directly.
      A real version would verify identity first (e.g. a magic link sent to that
      inbox) before showing anything.
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      window.location.href = 'dashboard.html?email=' + encodeURIComponent(email);
    });
  </script>
</body>
</html>
