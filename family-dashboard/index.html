<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Family Dashboard - Family Search Safety Alert</title>
<style>
  :root {
    --navy: #0F3057;
    --teal: #007EA7;
    --accent: #F4A261;
    --muted: #5C6B73;
    --ice: #CFE3F0;
    --green: #2E8B57;
    --border: #dde5ea;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: #222;
    background: linear-gradient(135deg, #0F3057 0%, #0B4F6C 45%, #007EA7 100%);
    background-size: 200% 200%;
    animation: gradientShift 14s ease infinite;
    padding: 40px 16px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .wrap.wide { max-width: 900px; }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(15,48,87,0.35);
    padding: 32px 36px;
    margin-bottom: 20px;
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .icon-circle {
    width: 42px; height: 42px; min-width: 42px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  .icon-circle svg { width: 22px; height: 22px; }
  h2 { margin: 0; font-size: 20px; color: var(--navy); }
  h2 span { display:block; font-weight:400; font-size:13px; color: var(--muted); margin-top:2px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 13.5px; color: var(--muted); background: #f2f5f7;
  }
  .tab.active { background: var(--navy); color: #fff; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 13.5px; color: var(--navy); }
  input {
    width: 100%; padding: 10px 12px; margin-top: 6px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fbfdfe;
  }
  input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,126,167,0.15); }
  button {
    margin-top: 22px; padding: 12px 20px; width: 100%; cursor: pointer;
    background: var(--navy); color: #fff; border: none; border-radius: 9px;
    font-size: 14.5px; font-weight: 600;
  }
  button:hover { background: var(--teal); }
  .msg { margin-top: 12px; font-size: 13.5px; font-weight: 600; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: var(--green); }
  .code-display {
    text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 4px;
    color: var(--navy); background: var(--ice); padding: 16px; border-radius: 10px; margin-top: 16px;
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #fff; }
  .top-bar .family-name { font-size: 22px; font-weight: 700; }
  .top-bar .family-code { font-size: 13px; opacity: 0.85; }
  .logout-btn {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; width: auto; margin: 0;
  }
  .device-card {
    background: #fff; border-radius: 14px; padding: 18px 22px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(15,48,87,0.12);
  }
  .device-card .device-title { font-size: 16px; font-weight: 700; color: var(--navy); }
  .device-card .device-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .alert-row {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #eef2f5;
  }
  .alert-row:first-of-type { border-top: none; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: #fff; white-space: nowrap;
  }
  .badge.crisis { background: #c0392b; }
  .badge.moderate { background: var(--accent); }
  .badge.uninstall { background: var(--muted); }
  .badge.unknown { background: #90A4AE; }
  .alert-text { flex: 1; }
  .alert-text .query { font-size: 13.5px; color: #222; font-style: italic; }
  .alert-text .time { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .empty { color: #fff; text-align: center; padding: 40px 0; opacity: 0.85; }
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <div class="card">
    <div class="header">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z"></path>
        </svg>
      </div>
      <h2>Family Search Safety Alert<span>Family Dashboard</span></h2>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabLogin">Log in</div>
      <div class="tab" id="tabCreate">Create a family</div>
    </div>

    <div id="loginForm">
      <label for="loginFamilyId">Family code</label>
      <input type="text" id="loginFamilyId" placeholder="e.g. AA5B74" style="text-transform:uppercase;" />
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Your password" />
      <button id="loginBtn">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="createForm" style="display:none;">
      <label for="createFamilyName">Family name</label>
      <input type="text" id="createFamilyName" placeholder="e.g. The Karagi Family" />
      <label for="createAdminEmail">Your email</label>
      <input type="email" id="createAdminEmail" placeholder="you@example.com" />
      <label for="createPassword">Choose a password</label>
      <input type="password" id="createPassword" placeholder="At least 6 characters" />
      <button id="createBtn">Create family</button>
      <div class="msg" id="createMsg"></div>
      <div id="codeResult" style="display:none;">
        <div class="code-display" id="newFamilyCode"></div>
        <div class="msg" style="color:var(--muted); font-weight:400; margin-top:10px;">
          Save this code. Enter it in the "Family code" field on each device's
          extension settings to link that device to this family.
        </div>
      </div>
    </div>
  </div>
</div>

<div id="dashView" class="wrap wide" style="display:none;">
  <div class="top-bar">
    <div>
      <div class="family-name" id="dashFamilyName"></div>
      <div class="family-code">Family code: <span id="dashFamilyCode"></span></div>
    </div>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
  <div id="devicesArea"></div>
</div>

<script>
const API = window.location.origin;
const loginView = document.getElementById("loginView");
const dashView = document.getElementById("dashView");

document.getElementById("tabLogin").onclick = () => switchTab("login");
document.getElementById("tabCreate").onclick = () => switchTab("create");
function switchTab(which) {
  document.getElementById("tabLogin").classList.toggle("active", which === "login");
  document.getElementById("tabCreate").classList.toggle("active", which === "create");
  document.getElementById("loginForm").style.display = which === "login" ? "block" : "none";
  document.getElementById("createForm").style.display = which === "create" ? "block" : "none";
}

document.getElementById("createBtn").onclick = async () => {
  const familyName = document.getElementById("createFamilyName").value.trim();
  const adminEmail = document.getElementById("createAdminEmail").value.trim();
  const password = document.getElementById("createPassword").value;
  const msg = document.getElementById("createMsg");
  msg.textContent = ""; msg.className = "msg";
  if (!familyName || !adminEmail || !password) {
    msg.textContent = "Please fill in all fields."; msg.className = "msg error"; return;
  }
  try {
    const res = await fetch(API + "/family/create", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ familyName, adminEmail, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || "Something went wrong."; msg.className = "msg error"; return; }
    document.getElementById("newFamilyCode").textContent = data.familyId;
    document.getElementById("codeResult").style.display = "block";
    msg.textContent = "Family created!"; msg.className = "msg success";
  } catch (err) {
    msg.textContent = "Could not reach the server."; msg.className = "msg error";
  }
};

document.getElementById("loginBtn").onclick = async () => {
  const familyId = document.getElementById("loginFamilyId").value.trim().toUpperCase();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  msg.textContent = ""; msg.className = "msg";
  if (!familyId || !password) {
    msg.textContent = "Please fill in both fields."; msg.className = "msg error"; return;
  }
  try {
    const res = await fetch(API + "/family/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ familyId, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || "Invalid code or password."; msg.className = "msg error"; return; }
    sessionStorage.setItem("familyToken", data.token);
    sessionStorage.setItem("familyName", data.familyName);
    sessionStorage.setItem("familyId", data.familyId);
    showDashboard();
  } catch (err) {
    msg.textContent = "Could not reach the server."; msg.className = "msg error";
  }
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.clear();
  dashView.style.display = "none";
  loginView.style.display = "block";
};

function severityLabel(sev) {
  if (sev === "crisis") return "Crisis";
  if (sev === "moderate") return "Moderate";
  if (sev === "uninstall") return "Uninstalled";
  return "Alert";
}

async function showDashboard() {
  const token = sessionStorage.getItem("familyToken");
  if (!token) return;
  loginView.style.display = "none";
  dashView.style.display = "block";
  document.getElementById("dashFamilyName").textContent = sessionStorage.getItem("familyName");
  document.getElementById("dashFamilyCode").textContent = sessionStorage.getItem("familyId");

  const area = document.getElementById("devicesArea");
  area.innerHTML = '<div class="empty">Loading...</div>';

  try {
    const res = await fetch(API + "/api/family/summary?token=" + encodeURIComponent(token));
    if (!res.ok) {
      sessionStorage.clear();
      dashView.style.display = "none";
      loginView.style.display = "block";
      document.getElementById("loginMsg").textContent = "Session expired, please log in again.";
      document.getElementById("loginMsg").className = "msg error";
      return;
    }
    const data = await res.json();
    if (!data.devices.length) {
      area.innerHTML = '<div class="empty">No devices have joined this family yet. Enter this family code in a device\'s extension settings to link it.</div>';
      return;
    }
    area.innerHTML = "";
    data.devices.forEach((device) => {
      const deviceAlerts = data.alerts.filter(
        (a) => (a.deviceOwnerLabel || "(unlabeled device)") === device.deviceOwnerLabel
      );
      const div = document.createElement("div");
      div.className = "device-card";
      let alertsHtml = deviceAlerts.slice(0, 10).map((a) => `
        <div class="alert-row">
          <span class="badge ${a.severity || "unknown"}">${severityLabel(a.severity)}</span>
          <div class="alert-text">
            <div class="query">"${(a.searchQuery || "").replace(/</g,"&lt;")}"</div>
            <div class="time">${new Date(a.timestamp).toLocaleString()}</div>
          </div>
        </div>
      `).join("");
      div.innerHTML = `
        <div class="device-title">${device.deviceOwnerLabel}</div>
        <div class="device-meta">${device.alertCount} alert${device.alertCount === 1 ? "" : "s"} &middot; last seen ${new Date(device.lastSeen).toLocaleString()}</div>
        <div style="margin-top:10px;">${alertsHtml}</div>
      `;
      area.appendChild(div);
    });
  } catch (err) {
    area.innerHTML = '<div class="empty">Could not load family data.</div>';
  }
}

if (sessionStorage.getItem("familyToken")) {
  showDashboard();
}
</script>
</body>
</html>
